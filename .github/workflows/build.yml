name: Build EMON INDUSTRY Android APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Grant execute permission for gradlew
      run: chmod +x divisions/eapk-mobile/gradlew
    - name: Build with Gradle
      run: |
        cd divisions/eapk-mobile
        ./gradlew assembleDebug
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: EMON-INDUSTRY-APK
        path: divisions/eapk-mobile/app/build/outputs/apk/debug/app-debug.apk
