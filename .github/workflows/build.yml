name: Sovereign Mainframe CI
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Core Portal, Mobile & Division Assets
        run: |
          test -s docs/index.html
          test -s docs/manifest.json
          test -s divisions/eapk-mobile/app/src/main/assets/index.html
          test -s divisions/eios-mobile/EmonIndustryApp/EmonIndustryApp.swift
          grep -q "MD Nazmul Hossain" docs/index.html
          grep -q "EMON INDUSTRY" docs/index.html
          echo "All 9 divisions, founder profile, Web, Android & iOS assets verified."
