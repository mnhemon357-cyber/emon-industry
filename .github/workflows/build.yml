name: Build EMON INDUSTRY APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with: { java-version: '17', distribution: 'temurin' }
    - run: chmod +x divisions/eapk-mobile/gradlew
    - run: cd divisions/eapk-mobile && ./gradlew assembleDebug
    - uses: actions/upload-artifact@v4
      with: { name: EMON-INDUSTRY-APK, path: divisions/eapk-mobile/app/build/outputs/apk/debug/app-debug.apk }
