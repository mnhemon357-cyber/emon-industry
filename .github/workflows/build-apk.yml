name: Build EMON INDUSTRY Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Mainframe Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Licenses & Install Android 34 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compile Android Debug APK
        working-directory: divisions/eapk-mobile
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Package Release APK
        run: cp divisions/eapk-mobile/app/build/outputs/apk/debug/app-debug.apk EMON-INDUSTRY-v1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EMON-INDUSTRY-APK
          path: EMON-INDUSTRY-v1.0.apk

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0-latest -y 2>/dev/null || true
          git push origin :refs/tags/v1.0-latest 2>/dev/null || true
          gh release create v1.0-latest EMON-INDUSTRY-v1.0.apk \
            --target main \
            --title "EMON INDUSTRY PVT LTD — Android App (v1.0)" \
            --notes "Tap EMON-INDUSTRY-v1.0.apk below to download and install on Android."
