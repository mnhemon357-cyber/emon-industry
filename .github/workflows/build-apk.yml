name: Build EMON INDUSTRY Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Mainframe Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compile Android Debug APK
        working-directory: divisions/eapk-mobile
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare Release APK Artifact
        run: cp divisions/eapk-mobile/app/build/outputs/apk/debug/app-debug.apk EMON-INDUSTRY-v1.0.apk

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EMON-INDUSTRY-APK
          path: EMON-INDUSTRY-v1.0.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-latest
          name: "EMON INDUSTRY PVT LTD — Official Android App (v1.0)"
          body: "Automated Android APK build from EMON INDUSTRY Sovereign Mainframe (EAPK Division)."
          files: EMON-INDUSTRY-v1.0.apk
