name: Build EMON INDUSTRY Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compile APK
        working-directory: divisions/eapk-mobile
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleDebug --no-daemon
      - name: Package APK
        run: cp divisions/eapk-mobile/app/build/outputs/apk/debug/app-debug.apk EMON-INDUSTRY-v5.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EMON-INDUSTRY-v5.0-APK
          path: EMON-INDUSTRY-v5.0.apk
      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v5.0-latest -y 2>/dev/null || true
          git push origin :refs/tags/v5.0-latest 2>/dev/null || true
          gh release create v5.0-latest EMON-INDUSTRY-v5.0.apk --target main --title "EMON INDUSTRY PVT LTD — Linux Foundation Edition" --notes "Merged Linux Foundation layout with preserved founder profile."
