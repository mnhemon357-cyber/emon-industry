name: EMON quality checks
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m py_compile divisions/web-fullstack/server.py
      - run: python divisions/web-fullstack/test_server.py
