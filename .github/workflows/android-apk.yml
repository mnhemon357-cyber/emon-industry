name: Build EMON Academy APK
on:
  push:
    branches: [main, master]
    paths: ['divisions/eapk-mobile/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Build debug APK
        working-directory: divisions/eapk-mobile
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: emon-academy-debug-apk
          path: divisions/eapk-mobile/app/build/outputs/apk/debug/app-debug.apk
